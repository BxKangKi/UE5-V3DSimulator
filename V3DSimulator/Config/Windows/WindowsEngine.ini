; Windows runtime PSO work is GPU/driver-specific. Cooked shader bytecode does not replace it.
; Keep compilation asynchronous and leave CPU capacity for the menu, asset IO and rendering.
[ConsoleVariables]
r.PSOPrecaching=1
r.PSOPrecache.Components=1
r.PSOPrecache.Resources=0
r.PSOPrecache.GlobalShaders=1
r.pso.PrecompileThreadPoolSize=0
r.pso.PrecompileThreadPoolPercentOfHardwareThreads=25
r.pso.PrecompileThreadPoolSizeMin=1
r.pso.PrecompileThreadPoolSizeMax=4
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.StartupMode=2
r.ShaderPipelineCache.BackgroundBatchSize=1

; Produce stable shader keys during cooking for optional PSO capture/bundling on the build machine.
; This creates metadata, not a GPU-specific driver cache or a complete graphics PSO recording.
[DevOptions.Shaders]
NeedsShaderStableKeys=true
